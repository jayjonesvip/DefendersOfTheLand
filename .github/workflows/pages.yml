name: Build and deploy reader

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: pages-${{ github.ref }}
  cancel-in-progress: true

jobs:
  build:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-node@v7
        with:
          node-version: '22'
          cache: npm
      - uses: actions/setup-python@v7
        with:
          python-version: '3.12'
          cache: pip
      - run: npm ci
      - run: python -m pip install -r requirements.txt
      - run: npx playwright install --with-deps chromium
      - name: Build site, PDFs and EPUB
        run: npm run build
        env:
          SITE_URL: https://${{ github.repository_owner }}.github.io/${{ github.event.repository.name }}
      - run: npm test
      - name: Validate EPUB with EPUBCheck 5.4.0
        run: |
          curl --fail --location --retry 3 -o /tmp/epubcheck.zip https://github.com/w3c/epubcheck/releases/download/v5.4.0/epubcheck-5.4.0.zip
          unzip -q /tmp/epubcheck.zip -d /tmp/epubcheck
          java -jar /tmp/epubcheck/epubcheck-5.4.0/epubcheck.jar output/publishing/defenders-of-the-land-origins.epub
          java -jar /tmp/epubcheck/epubcheck-5.4.0/epubcheck.jar dist/books/origins-sample-chapters-01-03.epub
      - name: Save complete publishing files separately
        uses: actions/upload-artifact@v4
        with:
          name: kdp-publishing-files
          path: |
            output/publishing/defenders-of-the-land-origins.epub
            output/publishing/origins-ebook-cover.jpg
            output/publishing/origins-kdp-interior.pdf
            output/publishing/origins-kdp-cover.pdf
            output/publishing/print-specifications.json
          retention-days: 90
      - uses: actions/upload-pages-artifact@v4
        with:
          path: dist

  deploy:
    if: github.event_name != 'pull_request'
    needs: build
    runs-on: ubuntu-latest
    permissions:
      contents: read
      pages: write
      id-token: write
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-node@v7
        with:
          node-version: '22'
      - uses: actions/configure-pages@v5
      - name: Deploy
        id: deployment
        uses: actions/deploy-pages@v4
      - name: Verify hosted reader and every download
        run: node scripts/verify-hosted.cjs '${{ steps.deployment.outputs.page_url }}'
