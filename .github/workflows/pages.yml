name: Build and deploy public previews

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: pages-${{ github.ref }}
  cancel-in-progress: true

jobs:
  build:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-node@v7
        with:
          node-version: '22'
          cache: npm
      - run: npm ci
      - run: npx playwright install --with-deps chromium
      - name: Build approved previews only
        run: npm run build
        env:
          SITE_URL: ${{ vars.SITE_URL || 'https://clevelandsuperheroes.com' }}
      - run: npm test
      - uses: actions/upload-pages-artifact@v4
        with:
          path: dist

  cleanup-legacy-kdp:
    if: github.event_name == 'push' && github.ref == 'refs/heads/main'
    needs: build
    runs-on: ubuntu-latest
    permissions:
      contents: read
      actions: write
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-node@v7
        with:
          node-version: '22'
      - name: Remove author-approved legacy public KDP downloads
        run: node scripts/cleanup-legacy-kdp.cjs
        env:
          GITHUB_TOKEN: ${{ github.token }}

  deploy:
    if: github.event_name != 'pull_request'
    needs: build
    runs-on: ubuntu-latest
    permissions:
      contents: read
      pages: write
      id-token: write
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-node@v7
        with:
          node-version: '22'
      - uses: actions/configure-pages@v5
      - name: Deploy
        id: deployment
        uses: actions/deploy-pages@v4
      - name: Check public preview policy on the hosted site
        run: node scripts/verify-hosted.cjs '${{ steps.deployment.outputs.page_url }}'
